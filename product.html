<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ================= RESET ================= */
    * {
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #0f172a;
    }

    /* ================= HEADER ================= */
    header {
      background: linear-gradient(90deg, #0f172a, #020617);
      padding: 16px 24px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    /* ================= PRODUCT DETAIL ================= */
    .product-detail {
      display: flex;
      gap: 40px;
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(2,6,23,0.1);
    }

    /* ================= IMAGES ================= */
    .product-images {
      flex: 1;
    }

    #mainImage {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 14px;
      padding: 16px;
    }

    #thumbs {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    #thumbs img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #f8fafc;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border 0.2s ease;
    }

    #thumbs img:hover {
      border-color: #2563eb;
    }

    /* ================= INFO ================= */
    .product-info {
      flex: 1;
    }

    .product-info h2 {
      margin-top: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    .price {
      margin: 12px 0;
    }

    .price .mrp {
      text-decoration: line-through;
      color: #64748b;
      margin-right: 8px;
      font-size: 15px;
    }

    .price .selling {
      font-size: 28px;
      font-weight: 700;
      color: #2563eb;
    }

    #pDesc {
      margin: 18px 0;
      color: #334155;
      line-height: 1.6;
    }

    /* ================= BUTTON ================= */
    #addToCartBtn {
      padding: 14px 22px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    #addToCartBtn:hover {
      background: #1e40af;
    }

    /* ================= REVIEWS ================= */
    .reviews {
      max-width: 1100px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    .reviews h3 {
      margin-bottom: 16px;
    }

    #reviewsList p {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.08);
    }

    #reviewText {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      margin-top: 12px;
      resize: none;
    }

    #addReviewBtn {
      margin-top: 10px;
      padding: 12px 18px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #addReviewBtn:hover {
      background: #15803d;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 768px) {
      .product-detail {
        flex-direction: column;
        padding: 20px;
      }

      #mainImage {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">⬅ Back to Shop</a>
</header>

<main class="product-detail">

  <div class="product-images">
    <img id="mainImage">
    <div id="thumbs"></div>
  </div>

  <div class="product-info">
    <h2 id="pName"></h2>

    <p class="price">
      <span class="mrp" id="pMrp"></span>
      <span class="selling" id="pPrice"></span>
    </p>

    <p id="pDesc"></p>

    <button id="addToCartBtn">Add to Cart</button>
  </div>

</main>

<section class="reviews">
  <h3>Reviews</h3>
  <div id="reviewsList"></div>

  <textarea id="reviewText" placeholder="Write a review"></textarea>
  <button id="addReviewBtn">Add Review</button>
</section>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/product.js"></script>

</body>
</html>
