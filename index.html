<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini E-Commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div style="margin:20px 0; text-align:center;">
  <a href="orders.html">
    <button style="padding:12px 20px; font-size:16px;">
      📦 View My Orders
    </button>
  </a>
</div>

  <h2>Mini E-Commerce</h2>
  <a href="cart.html" class="cart-link">
    🛒 Cart <span id="cartCount">0</span>
  </a>
</header>

<!-- ANNOUNCEMENT BAR -->
<div class="announcement-bar">
  <div class="announcement-track" id="adsTrack"></div>
</div>

<!-- SEARCH & FILTER -->
<section class="top-bar">

  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Search products...">
  </div>

  <div class="filter-box">
    <button data-price="all" class="active">All</button>
    <button data-price="low">Under ₹1000</button>
    <button data-price="mid">₹1000–₹2000</button>
    <button data-price="high">Above ₹2000</button>
  </div>

</section>

<!-- PRODUCTS -->
<main class="product-grid" id="productList"></main>

<div id="toast" class="toast"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/cartCount.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
